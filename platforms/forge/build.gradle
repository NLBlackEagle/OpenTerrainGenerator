plugins {
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
}

base.archivesName = "${mod_name}-forge"

minecraft {
    mappings channel: "${forge_mappings_channel}", version: "${forge_mappings_version}"

    accessTransformer = file("src/main/resources/META-INF/${forge_access_transformers}")

    runs {
        client {
            taskName "runClient ${mod_name} ${minecraft_version}"
            environment 'MC_VERSION', "${minecraft_version}"
            property 'fml.coreMods.load', "${forge_plugin_class}"
        }

        server {
            taskName "runServer ${mod_name} ${minecraft_version}"
            environment 'MC_VERSION', "${minecraft_version}"
            property 'fml.coreMods.load', "${forge_plugin_class}"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':common')
    implementation "curse.maven:worldedit-225608:${worldedit_forge_version}"
}

processResources {
    inputs.property 'version', "${mod_version}"

    filesMatching('mcmod.info') {
        expand version: inputs.properties.get('version')
    }
}

jar {
    manifest {
        attributes 'FMLAT': "${forge_access_transformers}"
        attributes 'FMLCorePlugin': "${forge_plugin_class}"
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

jar.finalizedBy('reobfJar')

configurations {
    shadow
}

artifacts {
    shadow jar.archiveFile
}
