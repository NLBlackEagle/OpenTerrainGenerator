plugins {
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
}

base.archivesName = "${mod_name}-forge"

minecraft {
    mappings channel: "${forge_mappings_channel}", version: "${forge_mappings_version}"

    accessTransformer = file("src/main/resources/META-INF/${forge_access_transformers}")
}

repositories {
    maven { url = 'https://maven.enginehub.org/artifactory/repo/' } // worldedit
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':common')
    compileOnly "com.sk89q.worldedit:worldedit-forge-mc1.11:${worldedit_forge_version}"
    compileOnly "com.sk89q.worldedit:worldedit-core:${worldedit_core_version}"
}

processResources {
    inputs.property 'version', "${mod_version}"

    filesMatching('mcmod.info') {
        expand version: inputs.properties.get('version')
    }
}

jar {
    manifest {
        attributes 'FMLAT': "${forge_access_transformers}"
        attributes 'FMLCorePlugin': "${forge_plugin_class}"
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

jar.finalizedBy('reobfJar')

configurations {
    shadow
}

artifacts {
    shadow jar.archiveFile
}
