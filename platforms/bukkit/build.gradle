plugins {
    id 'java'
}

base.archivesName = "${mod_name}-bukkit"

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' } // bukkit
    maven { url = "https://rutgerkok.nl/repo/" } // spigot
    maven { url = 'https://maven.enginehub.org/artifactory/repo/' } // worldedit
}

dependencies {
    implementation "org.bukkit:bukkit:${minecraft_version}-${bukkit_version}"
    implementation "org.spigotmc:spigot:${minecraft_version}-${bukkit_version}"
    implementation project(':common')
    compileOnly "com.sk89q.worldedit:worldedit-bukkit:${worldedit_bukkit_version}"
    compileOnly "com.sk89q.worldedit:worldedit-core:${worldedit_core_version}"
}

processResources {
    inputs.property 'version', "${mod_version}"

    filesMatching('plugin.yml') {
        expand version: inputs.properties.get('version')
    }
}

configurations {
    shadow
}

artifacts {
    shadow jar.archiveFile
}
