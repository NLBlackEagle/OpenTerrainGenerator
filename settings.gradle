pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.gofancy.wtf/releases' }
    }
}

include 'common', 'bukkit', 'forge'
project(':bukkit').projectDir = file('platforms/bukkit')
project(':forge').projectDir = file('platforms/forge')
